<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luckysheet Next - DDD Refactoring Dev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    .header { height: 40px; background: #217346; color: white; display: flex; align-items: center; padding: 0 16px; font-size: 14px; }
    .toolbar { height: 36px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; padding: 0 8px; gap: 4px; }
    .toolbar button { padding: 4px 8px; border: 1px solid #ddd; background: white; border-radius: 3px; cursor: pointer; font-size: 12px; }
    .toolbar button:hover { background: #e8f5e9; }
    .formula-bar { height: 28px; background: white; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; padding: 0 8px; }
    .formula-bar input { flex: 1; border: none; outline: none; font-size: 13px; }
    .canvas-container { flex: 1; position: relative; overflow: hidden; }
    #luckysheet-canvas { position: absolute; top: 0; left: 0; }
    .sheet-bar { height: 30px; background: #f8f9fa; border-top: 1px solid #e0e0e0; display: flex; align-items: center; padding: 0 8px; }
    .sheet-tab { padding: 4px 12px; border: 1px solid #ddd; background: white; border-radius: 3px 3px 0 0; font-size: 12px; cursor: pointer; }
    .sheet-tab.active { background: white; border-bottom-color: white; }
    .status-bar { height: 22px; background: #217346; color: white; display: flex; align-items: center; padding: 0 16px; font-size: 11px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">Luckysheet Next (DDD / TypeScript)</div>
    <div class="toolbar">
      <button id="btn-cf-greater">条件格式: 大于</button>
      <button id="btn-cf-databar">数据条</button>
      <button id="btn-cf-color">色阶</button>
      <button id="btn-cf-icons">图标集</button>
      <button id="btn-cf-delete">删除条件格式</button>
      <span style="margin-left: 12px; color: #666; font-size: 12px;">|</span>
      <button id="btn-test-all">运行测试</button>
    </div>
    <div class="formula-bar">
      <span style="color: #666; margin-right: 8px;">fx</span>
      <input type="text" id="formula-input" placeholder="输入公式或值..." />
    </div>
    <div class="canvas-container">
      <canvas id="luckysheet-canvas"></canvas>
    </div>
    <div class="sheet-bar">
      <div class="sheet-tab active">Sheet1</div>
    </div>
    <div class="status-bar">
      <span id="status-text">就绪</span>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
